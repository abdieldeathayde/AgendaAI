services:
  db:
    image: mysql:8.4
    container_name: agendaai_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-agendaai}
      MYSQL_USER: ${DB_USER:-agendaai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agendaai_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${DB_USER:-agendaai} -p$${DB_PASSWORD:-agendaai_password} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    container_name: agendaai_web
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DB_NAME: ${DB_NAME:-agendaai}
      DB_USER: ${DB_USER:-agendaai}
      DB_PASSWORD: ${DB_PASSWORD:-agendaai_password}
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
      DJANGO_RUNSERVER: "1"
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
